# Configuration for the application
spring.application.name=pasadita-api
server.port=8080

# Configuration for the database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/la_pasadita_database?useSSL=false&serverTimezone=GMT-6&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}

# Jackson 3 (Spring Boot 4) - REQUIRED, applies to every profile. Pure Jackson 3 defaults bind the
# Lombok DTOs/entities through their all-args constructor and reject absent primitives: login and any
# body without `active` fail, and field defaults (active = true, discountAmount = 0) are lost.
# This keeps the Boot 3.x / Jackson 2 JSON contract the frontend and the print agent rely on
spring.jackson.use-jackson2-defaults=true

# Hibernate properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS - empty on purpose: falls through to CorsConfig's development
# origin patterns (localhost, 127.0.0.1, LAN ranges)
app.cors.allowed-origins=

# JWT Configuration
# The fallback is a readable dev/test placeholder (valid base64), not a secret.
# Production requires JWT_SECRET: application-prod.properties has no default.
jwt.secret=${JWT_SECRET:LocalDevelopmentOnlyNotASecretUseJwtSecretEnvVarInProduction}
jwt.expiration=86400000

# Facturacion CFDI 4.0 - Emisor
# Facturapi toma los datos del emisor de la organizacion ligada a FACTURAPI_KEY.
# El codigo solo lee regimen-fiscal (retencion ISR de RESICO, 626 = valor de produccion);
# RFC, razon social y CP son opcionales y nunca se versionan con valores reales.
facturacion.emisor.rfc=${EMISOR_RFC:}
facturacion.emisor.razon-social=${EMISOR_RAZON_SOCIAL:}
facturacion.emisor.regimen-fiscal=${EMISOR_REGIMEN_FISCAL:626}
facturacion.emisor.codigo-postal=${EMISOR_CODIGO_POSTAL:}

# Facturacion CFDI 4.0 - CSD (certificados locales para desarrollo)
facturacion.csd.cer-path=${CSD_CER_PATH:certs/dummy.cer}
facturacion.csd.key-path=${CSD_KEY_PATH:certs/dummy.key}
facturacion.csd.password=${CSD_PASSWORD:dummy}

# Facturapi - Test/Live API key (secret)
facturapi.key=${FACTURAPI_KEY:dummy_key_for_testing}

# Cloudflare R2 (S3-compatible) object storage
cloudflare.r2.access-key=${R2_ACCESS_KEY:dummy-access-key}
cloudflare.r2.secret-key=${R2_SECRET_KEY:dummy-secret-key}
cloudflare.r2.endpoint=${R2_ENDPOINT:https://dummy.r2.cloudflarestorage.com}
cloudflare.r2.bucket=${R2_BUCKET:lapasadita-assets}
cloudflare.r2.public-url=${R2_PUBLIC_URL:https://assets.example.com}

# Ventas - id del cliente "Publico en general" (nunca puede quedar con saldo)
app.sales.walk-in-customer-id=${WALK_IN_CUSTOMER_ID:1}
