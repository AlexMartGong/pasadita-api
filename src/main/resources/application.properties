cloudflare.r2.endpoint=${R2_ENDPOINT:https://dummy.r2.cloudflarestorage.com}
cloudflare.r2.bucket=${R2_BUCKET:lapasadita-assets}
cloudflare.r2.public-url=${R2_PUBLIC_URL:https://assets.example.com}
