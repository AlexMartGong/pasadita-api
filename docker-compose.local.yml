# =============================================================================
# LA PASADITA API - Local testing stack
# =============================================================================
# Usage:
#   docker build -t pasadita-api:prod .
#   docker compose -f docker-compose.local.yml up -d
#
# Notes:
#   - scriptLP.sql (canonical DDL) is mounted as a MySQL init script so the
#     prod profile's ddl-auto=validate passes on a fresh database. It only
#     runs on first initialization of the mysql_local_data volume; to re-seed:
#     docker compose -f docker-compose.local.yml down -v
#   - All secrets below are local-only dummy values. Never reuse in prod.
# =============================================================================

services:
  local-db:
    image: mysql:8.0
    container_name: pasadita_mysql_local
    restart: always
    ports:
      # Host 3307 — 3306 is taken by the host's local MySQL.
      # Inside the compose network the API still reaches local-db:3306
      - "3307:3306"
    environment:
      MYSQL_DATABASE: la_pasadita_database
      MYSQL_ROOT_PASSWORD: Root1234
    volumes:
      - mysql_local_data:/var/lib/mysql
      - ./src/main/resources/scriptLP.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP so the check doesn't pass early against the
      # socket-only temporary server MySQL runs during first initialization
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pRoot1234"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  local-api:
    image: pasadita-api:prod
    container_name: pasadita_api_local
    ports:
      - "8080:8080"
    depends_on:
      local-db:
        condition: service_healthy
    environment:
      # allowPublicKeyRetrieval is required for MySQL 8 caching_sha2_password
      # auth over a non-SSL local connection
      DB_URL: jdbc:mysql://local-db:3306/la_pasadita_database?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: Root1234
      # Local frontend origin — prod default (https://lapasadita.app) stays
      # when this var is absent
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Must be valid base64 (TokenJwtConfig base64-decodes it); decodes to
      # 48 bytes. Local-only value
      JWT_SECRET: EnmHdfgjOTQIVRsLpBV82vc8WkmrnagZQDo5FmLIWfRXx7pcsEbFI8GPdxvvobre
      JWT_EXPIRATION: "86400000"
      CSD_CER_PATH: certs/dummy.cer
      CSD_KEY_PATH: certs/dummy.key
      CSD_PASSWORD: dummylocal
      FACTURAPI_KEY: dummylocal
      R2_ACCESS_KEY: dummylocal
      R2_SECRET_KEY: dummylocal
      # Must be a valid URI: the S3Client bean is built eagerly at startup
      R2_ENDPOINT: https://dummylocal.r2.cloudflarestorage.com
      R2_BUCKET: lapasadita-assets
      R2_PUBLIC_URL: https://assets-dummylocal.example.com

volumes:
  mysql_local_data:
